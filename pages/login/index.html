<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>B 站账号与订阅</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div class="brand">
          <div class="logo" aria-hidden="true">B</div>
          <div>
            <h1 data-i18n="views.login.heading">B 站账号</h1>
            <p class="sub" data-i18n="views.login.subheading">
              登录后可读取 AI 字幕、视频总结，并降低接口风控概率。
            </p>
          </div>
        </div>
        <button id="refreshBtn" class="btn ghost" type="button" data-i18n="views.login.refresh">
          刷新状态
        </button>
      </header>

      <section class="card account" aria-live="polite">
        <div class="account-head">
          <div id="avatar" class="avatar" aria-hidden="true">B</div>
          <div class="account-info">
            <div class="status-line">
              <span id="statusDot" class="dot"></span>
              <span id="statusText" data-i18n="views.login.loading">加载中…</span>
            </div>
            <div id="userName" class="user-name">—</div>
            <div id="userMeta" class="muted"></div>
          </div>
          <div class="account-actions">
            <button id="authBtn" class="btn primary" type="button" data-i18n="views.login.generate">
              生成登录二维码
            </button>
            <button id="logoutBtn" class="btn ghost hidden" type="button" data-i18n="views.login.logout">
              退出登录
            </button>
          </div>
        </div>

        <div id="qrPanel" class="qr-panel hidden">
          <div id="qrBox" class="qr-box" aria-label="Bilibili login QR code"></div>
          <div class="qr-side">
            <p id="qrState" class="qr-state" data-i18n="views.login.waiting">等待扫码…</p>
            <p class="muted" data-i18n="views.login.scan_hint">
              使用 B 站手机客户端扫描二维码
            </p>
            <button id="regenBtn" class="btn ghost" type="button" data-i18n="views.login.generate">
              重新生成
            </button>
          </div>
        </div>

        <div id="message" class="message hidden" role="status"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <h2 data-i18n="views.login.autoreply">自动回复</h2>
            <p id="autoreplyInfo" class="muted"></p>
          </div>
          <span id="autoreplyPill" class="pill">—</span>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <h2 data-i18n="views.login.subs">订阅概览</h2>
            <p id="lastCheck" class="muted"></p>
          </div>
          <span id="poller" class="pill">—</span>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label" data-i18n="views.login.subs_total">订阅总数</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="statSessions">0</span>
            <span class="stat-label" data-i18n="views.login.subs_sessions">会话数</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="statUps">0</span>
            <span class="stat-label" data-i18n="views.login.subs_ups">UP 主数</span>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-i18n="views.login.uid">UID</th>
                <th>UP 主</th>
                <th data-i18n="views.login.types">类型</th>
                <th data-i18n="views.login.sessions">订阅会话数</th>
              </tr>
            </thead>
            <tbody id="subsBody"></tbody>
          </table>
          <div id="subsEmpty" class="empty hidden" data-i18n="views.login.subs_empty">
            还没有任何订阅。在聊天中发送 /bili sub add &lt;UID&gt; 即可添加。
          </div>
        </div>
      </section>

      <footer class="footer">
        <span data-i18n="views.login.note">
          登录凭据仅保存在本机 AstrBot 的 plugin_data 目录，不会上传到第三方。
        </span>
        <span id="version" class="muted"></span>
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
